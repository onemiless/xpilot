name: xpilot checks

on:
  pull_request:
  push:
    branches: [xpilot]
  workflow_dispatch:
    inputs:
      plugins_ref:
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/msgq_repo
    steps:
    - uses: actions/checkout@v4
    - run: git submodule update --init --depth 1 msgq_repo
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pyzmq numpy pycapnp pytest zstandard setproctitle cython scons setuptools requests pyyaml cffi
    - name: Build msgq
      working-directory: msgq_repo
      run: scons -j4 msgq/ipc_pyx.so
    - uses: actions/checkout@v4
      with:
        repository: onemiless/xpilot-plugins
        path: xpilot-plugins
        ref: ${{ inputs.plugins_ref }}
    - name: Record commits
      run: |
        mkdir -p /tmp/xpilot-ci
        echo "xpilot = $GITHUB_SHA" > /tmp/xpilot-ci/commits.txt
        echo "xpilot-plugins = $(git -C xpilot-plugins rev-parse HEAD)" >> /tmp/xpilot-ci/commits.txt
    - name: Generated files are current
      run: |
        python3 openpilot/tesla/plugins/gen_params.py --check
    - name: Auto-merge classifier
      run: python3 tools/ci/pr_risk.py --check
    - name: XPILOT.md section 11 host checks
      run: |
        set -e
        for check in static_imports tile_layout_check plugin_host_check manifest_check safety_manifest_check \
                     phase2_check phase3_check phase4_check store_check offroad_pages_check agnos_update_check network_contract_check network_owner_check \
                     network_approved_open_check network_hash_cancel_check network_provision_cancel_check network_gateway_timeout_check \
                     network_transition_hook_check network_pending_fence_check network_journal_failure_check network_release_onroad_check \
                     network_start_failure_cleanup_check network_startcore_parking_check network_startcore_check network_gateway_deps_check network_manifest_merge_check; do
          echo "::group::$check"
          python3 tools/sp_tesla_e2e/$check.py > /tmp/xpilot-ci/$check.json
          echo "::endgroup::"
        done
    - name: Plugin message broker end to end (Linux credentials)
      run: python3 tools/sp_tesla_e2e/plugin_msg_e2e.py
    - name: Store activation transaction end to end
      run: python3 tools/sp_tesla_e2e/store_activation_e2e.py --output /tmp/xpilot-ci/store-activation
    - name: Plugin repository end to end
      run: |
        set -o pipefail
        python3 tools/sp_tesla_e2e/store_e2e.py --repo xpilot-plugins 2>&1 | tee /tmp/xpilot-ci/store_e2e.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: xpilot-checks-${{ github.run_id }}
        path: /tmp/xpilot-ci
        retention-days: 30
    - name: Tell the owner xpilot is broken
      if: failure() && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh issue create --title "xpilot checks failed at ${GITHUB_SHA::10}" --body "@onemiless $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
